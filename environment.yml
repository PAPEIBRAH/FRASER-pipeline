name: fraser_env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ─────────────────────────────
  # Core R
  # ─────────────────────────────
  - r-base=4.5
  - r-essentials
  - r-devtools

  # ─────────────────────────────
  # Bioconductor core stack
  # ─────────────────────────────
  - bioconductor-fraser
  - bioconductor-biocparallel
  - bioconductor-rsamtools
  - bioconductor-genomicranges
  - bioconductor-summarizedexperiment
  - bioconductor-biobase
  - bioconductor-iranges
  - bioconductor-biostrings
  - bioconductor-xvector
  - bioconductor-matrixgenerics

  # Annotation packages
  - bioconductor-txdb.hsapiens.ucsc.hg38.knowngene
  - bioconductor-org.hs.eg.db

  # ─────────────────────────────
  # CRAN dependencies (IMPORTANT: precompiled via conda)
  # ─────────────────────────────
  - r-curl
  - r-httr
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-readr

  # system libs (avoid compile issues)
  - libcurl
  - openssl
  - zlib
